<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>在评估活动中提问的基本技巧</title>
  <style>
    :root{--blue:#159ee7;--deep:#087fc4;--sky:#def5ff;--yellow:#ffd45f;--ink:#173b59;--muted:#68839a;--white:#fff;--green:#57bf8b;--shadow:0 18px 48px rgba(14,104,164,.18)}
    *{box-sizing:border-box} body{margin:0;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;color:var(--ink);background:linear-gradient(145deg,#c7efff,#f5fcff 52%,#fff2bf);min-height:100vh;overflow-x:hidden}
    button{font:inherit}.hidden{display:none!important}.app{width:min(1180px,100%);margin:auto;padding:20px}
    .topbar{display:flex;align-items:center;gap:16px;background:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.95);box-shadow:var(--shadow);border-radius:22px;padding:13px 18px;backdrop-filter:blur(12px)}
    .brand{display:flex;align-items:center;gap:10px;font-weight:900;color:var(--deep);white-space:nowrap}.brand-badge{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#ffd85b,#ffb632);font-size:22px;box-shadow:0 6px 14px #ffcb5688}
    .progress{flex:1;display:grid;grid-template-columns:repeat(8,1fr);gap:6px}.progress i{height:9px;border-radius:99px;background:#dceaf2;transition:.35s}.progress i.on{background:linear-gradient(90deg,#24b6f2,#138bd8);box-shadow:0 2px 8px #1da9ed66}
    .stepmark{font-weight:800;color:#708aa0;min-width:74px;text-align:right}
    .layout{display:grid;grid-template-columns:290px 1fr;gap:18px;margin-top:18px}.side,.main{background:rgba(255,255,255,.88);border:1px solid #fff;border-radius:26px;box-shadow:var(--shadow)}
    .side{padding:20px}.tag{display:inline-flex;gap:7px;align-items:center;background:#e6f7ff;color:#0786cc;padding:7px 11px;border-radius:99px;font-weight:900;font-size:13px}.side h1{font-size:27px;line-height:1.28;margin:16px 0 8px;color:#078bd4}.side p{color:var(--muted);font-size:14px;line-height:1.75;margin:0}.principle{margin-top:18px;background:linear-gradient(145deg,#fff9dc,#fff);border:1px solid #ffe297;border-radius:18px;padding:15px}.principle b{color:#cc8500}.principle div{font-size:13px;line-height:1.65;margin-top:7px;color:#6e6042}
    .timeline{margin-top:18px;display:grid;gap:8px}.timeline button{border:0;background:transparent;color:#7890a3;text-align:left;padding:9px 10px;border-radius:12px;font-size:13px}.timeline button.current{background:#eaf8ff;color:#067fbe;font-weight:900}.timeline button.done:before{content:"✓ ";color:#35ac77}

<body>
  <div class="intro" id="intro"><div class="intro-card"><div class="intro-copy"><span class="tag">⭐ 功能性评估 · 情境实操</span><h1>在评估活动中<br>提问的基本技巧</h1><h2>红豆分类观察任务</h2><p>请扮演评估者，依次完成简单指令、等待、视觉提示、示范提示、撤除提示和自然情境转换，记录小明的真实能力表现。</p><button class="primary" id="startBtn">开始观察　→</button></div><div class="intro-scene"></div></div></div>
  <main class="app"><header class="topbar"><div class="brand"><span class="brand-badge">⭐</span>功能性评估</div><div class="progress" id="progress"></div><div class="stepmark" id="stepmark">1 / 8</div></header>
    <div class="layout"><aside class="side"><span class="tag">观察任务单</span><h1>提问不是“考学生”</h1><p>通过逐级、最少必要的提示，观察学生在真实任务中的独立表现与支持需求。</p><div class="principle"><b>核心原则</b><div>指令要短、一次一个动作；给足等待时间；提示由少到多；获得成功后及时撤除。</div></div><div class="timeline" id="timeline"></div></aside><section class="main"><div class="stage" id="stage"><div class="scene-title"><small id="eyebrow"></small><h2 id="title"></h2></div><div id="scene"></div><div id="action"></div></div></section></div>
  </main><div class="toast" id="toast"></div>
  <script>
  (()=>{
    const steps=[
      {t:'准备观察',e:'01 · 情境建立',d:'确认材料与环境，避免无关干扰。'},
      {t:'简单指令 + 等待',e:'02 · 不追加问题',d:'说“红豆，拿出来”，静默等待约 7 秒。'},
      {t:'一级：视觉提示',e:'03 · 最少提示',d:'将手势移到红豆旁，仅重复关键词“红豆”。'},
      {t:'二级：示范提示',e:'04 · 动作示范',d:'慢慢拿起、展示并放入小碟，再说“你来”。'},
      {t:'三级：身体辅助',e:'05 · 条件分支',d:'仅在示范仍失败时使用，本案例可跳过。'},
      {t:'撤除提示再观察',e:'06 · 多次采样',d:'不再提示，连续观察 4 次独立操作。'},
      {t:'自然情境转换',e:'07 · 约 3 分钟后',d:'以感谢与饮品选择自然转场。'},
      {t:'总结与回看',e:'08 · 形成记录',d:'根据最少有效提示等级记录 0–3 分。'}
    ];
    let step=1,timers=[],sorted=0,correct=0,replayTimers=[];
    const $=s=>document.querySelector(s), scene=$('#scene'),action=$('#action'),toastEl=$('#toast');
    $('#progress').innerHTML=steps.map(()=>'<i></i>').join('');
    $('#timeline').innerHTML=steps.map((x,i)=>`<button data-i="${i+1}">${i+1}. ${x.t}</button>`).join('');
    const wait=(fn,ms)=>{let id=setTimeout(fn,ms);timers.push(id);return id};
    function say(text){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=.86;speechSynthesis.speak(u)}}
    function toast(msg){toastEl.textContent=msg;toastEl.classList.add('show');wait(()=>toastEl.classList.remove('show'),1700)}
    function clear(){timers.forEach(clearTimeout);timers=[];replayTimers.forEach(clearTimeout);replayTimers=[];speechSynthesis?.cancel();scene.innerHTML='';action.innerHTML=''}
    function go(n){clear();step=n;$('#title').textContent=steps[n-1].t;$('#eyebrow').textContent=steps[n-1].e;$('#stepmark').textContent=`${n} / 8`;document.querySelectorAll('.progress i').forEach((x,i)=>x.classList.toggle('on',i<n));document.querySelectorAll('.timeline button').forEach((x,i)=>{x.classList.toggle('current',i===n-1);x.classList.toggle('done',i<n-1)});renderScene(n);renderAction(n)}
    function next(){go(Math.min(8,step+1))}
    function people(){return `<div class="people"><div class="person"><div class="head"></div><div class="body"></div><span class="name">评估者</span></div><div class="person child"><div class="head"></div><div class="body"></div><span class="name">小明</span></div></div>`}
    function bench(){return `<div class="workbench"><div class="bowl"></div><div class="dish"></div></div>`}
    function record(text,score='等待记录',warn=true){return `<div class="record"><strong>📝 观察记录</strong><p>${text}</p><span class="score ${warn?'warn':''}">${score}</span></div>`}
    function speech(text){return `<div class="speech"><button class="speak-btn" aria-label="播放语音">🔊</button>${text}</div>`}
    function renderScene(n){
      if(n===1){scene.innerHTML=people()+bench()+record('材料已摆放：混合豆碗、小碟；小熊暂不出现。','准备就绪',false)}
      if(n===2){scene.innerHTML=people()+bench()+speech('红豆，拿出来')+`<div class="timer">等待 <span id="sec">7</span> 秒</div>`+record('小明看向豆碗，但尚未伸手。不要马上重复或改成长句。')}
      if(n===3){scene.innerHTML=people()+bench()+speech('红豆')+record('视觉提示后，小明转头并注视目标，但仍未完成拿取。','一级提示')+`<button class="hand" aria-label="拖动手势">☝️</button>`;showBeans(false,true);makeHandDraggable()}
      if(n===4){scene.innerHTML=people()+bench()+speech('看，红豆放这里……你来')+record('示范后，小明模仿并完成。最少有效提示等级：二级。','得分 2',false)+`<div class="demo-hand">🤏</div>`;showBeans(false,false)}
      if(n===5){scene.innerHTML=people()+bench()+record('三级身体辅助仅在示范仍失败时使用；本案例已在二级提示下完成。','未使用',false)}
      if(n===6){scene.innerHTML=people()+bench()+`<div class="counter">独立完成 <span id="count">0</span> / 4</div>`+record('提示已撤除。请将红豆拖入或点击放入小碟，连续记录 4 次。','准确率 0%');sorted=0;correct=0;showBeans(true,false)}
      if(n===7){scene.innerHTML=people()+bench()+speech('谢谢你帮我分红豆。休息一下，你想喝什么？')+record('用真实交流自然结束原任务，不说“现在开始下一项测试”。','自然转场',false)+`<button class="bear" aria-label="点击小熊继续">🧸</button>`}
      if(n===8){scene.innerHTML=`<div class="summary"><h2>本次观察结果：2 分</h2><div class="scoregrid"><div class="scorebox"><b>0</b>身体辅助</div><div class="scorebox"><b>1</b>示范后仍需帮助</div><div class="scorebox hit"><b>2</b>示范后完成</div><div class="scorebox"><b>3</b>独立完成</div></div><div class="flow" id="flow"><span>短指令</span><span>等待</span><span>视觉提示</span><span>示范提示</span><span>撤除提示</span><span>重复观察</span><span>自然转场</span></div><ul><li>一次只问一个动作，语言简短具体。</li><li>指令后留出处理时间，避免连续追问。</li><li>提示由少到多，只增加到成功所需的最低等级。</li><li>成功后撤除提示并多次观察，确认真实能力。</li></ul><div class="buttons"><button class="secondary" id="replay">▶ 回看完整流程</button><button class="primary" id="restart">重新体验</button></div></div>`}
      $('.speak-btn')?.addEventListener('click',()=>say($('.speech').textContent.trim()))
    }
    function renderAction(n){
      if(n===1) action.innerHTML=`<div class="action-card"><div class="tag">观察前准备</div><h3>材料与人物已就位</h3><p>让小明先熟悉桌面，不呈现小熊，也不提前解释评分规则。</p><button class="primary" data-next>开始发出指令</button></div>`;
      if(n===2) action.innerHTML='';
      if(n===3) action.innerHTML=`<div class="action-card" id="visualHelp"><h3>请实施一级视觉提示</h3><p>拖动 ☝️ 到任意红豆旁，或直接点击手势。</p><div class="tip-card"><b>只说关键词：</b>“红豆”。不加入新的动作要求。</div></div>`;
      if(n===4) action.innerHTML=`<div class="action-card"><h3>实施二级示范提示</h3><p>点击后观察：拿起 → 展示 → 放入小碟 → 邀请小明尝试。</p><button class="primary" id="demoBtn">播放示范</button><div class="tip-card"><b>本案例评分：</b>小明在示范后完成，应记 <b>2 分</b>，不是 1 分或 3 分。</div></div>`;
      if(n===5) action.innerHTML=`<div class="action-card"><h3>是否需要三级身体辅助？</h3><p>规则：仅当视觉和示范均无效时，才短暂手把手协助，并立刻逐步撤除。</p><div class="buttons"><button class="secondary" id="assistBtn">演示备用分支</button><button class="primary" data-next>本案例不需要，撤除提示</button></div></div>`;
      if(n===6) action.innerHTML='';
      if(n===7) action.innerHTML='';
      if(n===8) action.innerHTML='';
      document.querySelectorAll('[data-next]').forEach(b=>b.onclick=next);
      if(n===2) startTimer();
      if(n===4) $('#demoBtn').onclick=runDemo;
      if(n===5) $('#assistBtn').onclick=runPhysical;
      if(n===7) $('.bear').onclick=showDrinks;
      if(n===8){$('#restart').onclick=()=>{go(1);$('#intro').classList.remove('hidden')};$('#replay').onclick=runReplay}
    }
    function startTimer(){say('红豆，拿出来');let s=7;const tick=setInterval(()=>{s--;let el=$('#sec');if(el)el.textContent=s;if(s<=0){clearInterval(tick);toast('等待结束：小明尚未动作');action.innerHTML=`<div class="action-card"><h3>等待结束，仍未反应</h3><p>现在增加最少量的支持，而不是把问题越说越长。</p><div class="tip-card"><span class="wrong">“你能不能从这个装着很多豆子的碗里，把红色的豆子拿出来放在旁边的小碟子里？”</span><br><b>正确：</b>保持一个动作、一个特征。</div><button class="primary" data-next>增加一级视觉提示</button></div>`;action.querySelector('[data-next]').onclick=next}},1000);timers.push(tick)}
    function positions(){return [[82,88],[118,111],[151,79],[186,116],[104,65],[164,102]]}
    function showBeans(interactive,focus){let bowl=$('.bowl'),pos=positions();pos.forEach((p,i)=>{let b=document.createElement('div');b.className='bean'+(focus&&i===1?' focus':'');b.style.left=p[0]+'px';b.style.top=p[1]+'px';b.dataset.i=i;bowl.appendChild(b);if(interactive){b.addEventListener('pointerdown',beanPointerDown);b.addEventListener('click',()=>sortBean(b))}})}
    function makeHandDraggable(){let h=$('.hand'),wb=$('.workbench'),done=false;function complete(){if(done)return;done=true;$('#visualHelp')?.remove();document.querySelector('.bean')?.classList.add('focus');say('红豆');toast('已实施一级视觉提示');wait(()=>{action.innerHTML=`<div class="action-card"><h3>观察：注视目标，但未拿取</h3><p>一级提示不足，继续增加二级示范提示。</p><button class="primary" data-next>进入示范提示</button></div>`;action.querySelector('[data-next]').onclick=next},900)}h.onclick=complete;h.onpointerdown=e=>{h.setPointerCapture(e.pointerId);let r=wb.getBoundingClientRect(),dx=e.clientX-h.getBoundingClientRect().left,dy=e.clientY-h.getBoundingClientRect().top;h.onpointermove=ev=>{h.style.left=Math.max(0,Math.min(r.width-65,ev.clientX-r.left-dx))+'px';h.style.top=Math.max(0,Math.min(r.height-65,ev.clientY-r.top-dy))+'px'};h.onpointerup=()=>{h.onpointermove=null;complete()}}}
    function runDemo(){let btn=$('#demoBtn');btn.disabled=true;action.classList.add('hidden');let d=$('.demo-hand'),dish=$('.dish'),bean=$('.bean');d.classList.add('play');wait(()=>bean?.classList.add('focus'),850);wait(()=>{if(bean){bean.style.transition='1.15s';bean.style.left='362px';bean.style.top='118px'}dish.classList.add('hot')},1650);wait(()=>{say('你来');toast('小明模仿成功：记录 2 分')},3100);wait(()=>{dish.classList.remove('hot');action.classList.remove('hidden');action.innerHTML=`<div class="action-card"><h3>示范后完成：记录 2 分</h3><p>下一步先检查身体辅助分支规则，再撤除提示重新观察。</p><button class="primary" data-next>继续</button></div>`;action.querySelector('[data-next]').onclick=next},4100)}
    function runPhysical(){action.classList.add('hidden');let wb=$('.workbench'),a=document.createElement('div');a.className='assist play';a.textContent='🤝';wb.appendChild(a);say('我帮你做一次');wait(()=>toast('辅助后应立即减轻并撤除'),1300);wait(()=>{action.classList.remove('hidden');action.innerHTML=`<div class="action-card"><h3>备用分支演示完成</h3><p>手把手辅助只用于必要情况。本案例正式记录仍为二级示范后完成。</p><button class="primary" data-next>撤除所有提示</button></div>`;action.querySelector('[data-next]').onclick=next},3300)}
    function beanPointerDown(e){let b=e.currentTarget;if(b.classList.contains('sorted'))return;let wb=$('.workbench'),r=wb.getBoundingClientRect();b.setPointerCapture(e.pointerId);b.onpointermove=ev=>{b.style.left=Math.max(0,Math.min(r.width-30,ev.clientX-r.left-15))+'px';b.style.top=Math.max(0,Math.min(r.height-24,ev.clientY-r.top-11))+'px'};b.onpointerup=()=>{b.onpointermove=null;let dr=$('.dish').getBoundingClientRect(),br=b.getBoundingClientRect();if(br.left<dr.right&&br.right>dr.left&&br.top<dr.bottom&&br.bottom>dr.top)sortBean(b)}}
    function sortBean(b){if(!b||b.classList.contains('sorted'))return;b.classList.add('sorted');b.style.left=(350+(sorted%2)*25)+'px';b.style.top=(118+(sorted%2)*8)+'px';sorted++;correct++;$('#count').textContent=sorted;let pct=Math.round(correct/sorted*100);$('.score').textContent=`准确率 ${pct}%`;$('.score').classList.remove('warn');toast(`第 ${sorted} 次：独立完成`);if(sorted===4)wait(()=>{action.innerHTML=`<div class="action-card"><h3>连续 4 次独立完成</h3><p>准确率 100%。多次观察支持“小明已习得并能独立完成”的判断。</p><button class="primary" data-next>约 3 分钟后自然转场</button></div>`;action.querySelector('[data-next]').onclick=next},550)}
    function showDrinks(){say('你想喝什么？');scene.innerHTML=`${speech('你想喝什么？')}<div class="drinks"><div class="drink">🥛<b>牛奶</b></div><div class="drink">🧃<b>果汁</b></div><div class="drink">💧<b>温水</b></div></div>${record('已从分类任务自然过渡到真实的饮品选择情境。','转场完成',false)}`;$('.speak-btn').onclick=()=>say('你想喝什么？');wait(()=>{action.innerHTML=`<div class="action-card"><h3>自然情境转换完成</h3><p>感谢、休息和真实选择让评估自然融入活动。</p><button class="primary" data-next>查看总结</button></div>`;action.querySelector('[data-next]').onclick=next},850)}
    function runReplay(){let spans=[...document.querySelectorAll('#flow span')];replayTimers.forEach(clearTimeout);replayTimers=[];spans.forEach(x=>x.classList.remove('on'));spans.forEach((x,i)=>replayTimers.push(setTimeout(()=>{spans.forEach(y=>y.classList.remove('on'));x.classList.add('on');say(x.textContent);if(i===spans.length-1)toast('完整流程回看完毕')},i*800)))}
    $('#startBtn').onclick=()=>{$('#intro').classList.add('hidden');go(2)};
    go(1);
  })();
  </script>
</body>
</html>
